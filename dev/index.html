<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Editable Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <div class="profile-image">
                <img src="assets/pfp.jpg" alt="Profile Picture">
            </div>
            <h1>User Profile</h1>
        </div>

        <div class="field-group">
            <label for="name">Name</label>
            <input type="text" id="name" class="modern-input primary-text" spellcheck="false">
        </div>

        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="modern-input primary-text" spellcheck="false">
        </div>

        <div class="section">
            <label>Interests</label>
            <div id="hobbies-container" class="chips-container">
                </div>
        </div>
        
        <div class="action-area">
            <button class="save-btn">Save Changes</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
